name: CI/CD Pipeline & DevSecOps Gates

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # 1. Build and Test Applications
  build-and-test:
    name: Build & Test (Java 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper Executable
        run: |
          chmod +x application/order-service/mvnw
          if [ -f application/inventory-service/mvnw ]; then
            chmod +x application/inventory-service/mvnw
          fi

      - name: Build and Test Order Service
        working-directory: application/order-service
        run: ./mvnw -B verify

      - name: Build and Test Inventory Service (if present)
        run: |
          if [ -d "application/inventory-service" ]; then
            cd application/inventory-service && ./mvnw -B verify
          fi

  # 2. DevSecOps: Secret Scanning (Gitleaks)
  gitleaks:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # 3. DevSecOps: Dependency & Filesystem Scanning (Trivy)
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner (FS)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # 4. Container Build & Image Scan
  container-security:
    name: Docker Build & Trivy Image Scan
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Order Service Docker Image
        run: |
          docker build -t order-service:ci -f docker/Dockerfile application/order-service

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'order-service:ci'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # 5. Helm Chart Linting
  helm-lint:
    name: Helm Chart Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint Helm Chart
        run: |
          if [ -d "helm/order-service" ]; then
            helm lint helm/order-service
          fi
