name: CI/CD Pipeline & DevSecOps Gates

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/parthdagia05

jobs:
  # 1. Build and Test Applications
  build-and-test:
    name: Build & Test (Java 25)
    runs-on: ubuntu-latest
    services:
      # The order service context test needs a real database
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: orderdb
          POSTGRES_USER: orderuser
          POSTGRES_PASSWORD: orderpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orderuser -d orderdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x application/order-service/mvnw application/inventory-service/mvnw

      - name: Build and Test Order Service
        working-directory: application/order-service
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/orderdb
        run: ./mvnw -B verify

      - name: Build and Test Inventory Service
        working-directory: application/inventory-service
        run: ./mvnw -B verify

  # 2. DevSecOps: Secret Scanning (Gitleaks)
  gitleaks:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: security/.gitleaks.toml

  # 3. DevSecOps: Dependency & Filesystem Scanning (Trivy)
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy Vulnerability Scanner (FS)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Resolve pom.xml dependencies without hitting Maven Central (avoids 429 rate limits)
          TRIVY_OFFLINE_SCAN: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          trivy-config: security/trivy.yaml

  # 4. Container Build & Image Scan
  container-security:
    name: Docker Build & Trivy Image Scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [build-and-test]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [order-service, inventory-service]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ matrix.service }}:ci \
            -t ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }} \
            application/${{ matrix.service }}

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ matrix.service }}:ci'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}

  # 5. Helm Chart Linting
  helm-lint:
    name: Helm Chart Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.14.0

      - name: Lint and Render Helm Chart
        run: |
          helm lint helm/order-service
          helm template order-release helm/order-service > /dev/null

  # 6. GitOps: write the new image tags back to Git so Argo CD deploys them
  update-manifests:
    name: Update Image Tags (GitOps)
    runs-on: ubuntu-latest
    needs: [container-security, gitleaks, dependency-scan, helm-lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bump Image Tags
        run: |
          for svc in order-service inventory-service; do
            sed -i -E "s#image: .*/?${svc}:.*#image: ${REGISTRY}/${svc}:${GITHUB_SHA}#" kubernetes/*-${svc}.yaml
          done
          sed -i -E "s#^  tag: .*#  tag: \"${GITHUB_SHA}\"#" helm/order-service/values.yaml
          git diff --stat

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kubernetes helm/order-service/values.yaml
          if git diff --cached --quiet; then
            echo "Image tags already up to date"
            exit 0
          fi
          git commit -m "deploy: update image tags to ${GITHUB_SHA::7}"
          git pull --rebase origin main
          git push origin HEAD:main
