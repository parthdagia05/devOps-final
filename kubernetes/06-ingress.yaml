# Ingress = HTTP routing from outside the cluster (host/path -> Service).
# Needs an Ingress controller installed in the cluster to actually work.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: order-service
  namespace: orders
spec:
  ingressClassName: nginx
  rules:
    - host: orders.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 80
