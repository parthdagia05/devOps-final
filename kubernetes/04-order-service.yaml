apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: orders
spec:
  # replicas is owned by the HPA (05-hpa.yaml, min 2). Setting it here would make
  # Argo CD selfHeal reset every scale event back to the Git value.
  selector:
    matchLabels:
      app: order-service           # Deployment manages pods with this label...
  template:
    metadata:
      labels:
        app: order-service         # ...and stamps it on every pod it creates
    spec:
      containers:
        - name: order-service
          image: ghcr.io/parthdagia05/order-service:31c7aa6dfdf24b7f0b1c523cb6870543d5f55db9
          imagePullPolicy: IfNotPresent   # tags are immutable commit SHAs, set by CI
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: order-service-config      # every key -> env var
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
          resources:
            requests:                    # what the scheduler reserves on a node
              cpu: 500m                  # JVM warmup alone uses ~200m; a lower request makes the HPA scale on startup
              memory: 256Mi
            limits:                      # hard ceiling; over memory limit = OOMKilled (exit 137)
              cpu: "2"
              memory: 512Mi
          # Startup: gives the JVM up to 5 minutes to boot. Liveness and readiness only start after it passes,
          # so a slow start under CPU pressure is not mistaken for a hung container.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          # Readiness: "send me traffic?"  Fails -> removed from Service, NOT restarted.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          # Liveness: "am I alive?"  Fails -> container is RESTARTED.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: orders
spec:
  type: ClusterIP            # internal only; we reach it with port-forward or Ingress
  selector:
    app: order-service
  ports:
    - port: 80               # Service port
      targetPort: 8080       # container port
