# Debug Drill 6: Bad Secret Reference (CreateContainerConfigError)
# Root Cause: The Pod definition references a Secret or Secret key that does not exist in the namespace.
# Kubelet cannot inject the requested environment variable or mount volume, so container creation fails.
# Diagnostic Command:
#   kubectl describe pod drill-bad-secret -n orders (Look at Events: Error: secret "missing-secret" not found / key not found)
apiVersion: v1
kind: Pod
metadata:
  name: drill-bad-secret
  namespace: orders
spec:
  containers:
    - name: app
      image: alpine:latest
      command: ["sleep", "3600"]
      env:
        - name: SECRET_TOKEN
          valueFrom:
            secretKeyRef:
              name: non-existent-secret-store
              key: missing_token
