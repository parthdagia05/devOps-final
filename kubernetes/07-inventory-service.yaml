apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: ghcr.io/parthdagia05/inventory-service:5d3ad6857523c1fc24dd514c9dcf1791111f752c
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          # Startup: gives the JVM up to 3 minutes to boot. Liveness and readiness only start after it passes,
          # so a slow start under CPU pressure is not mistaken for a hung container.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: orders
spec:
  type: ClusterIP
  selector:
    app: inventory-service
  ports:
    - port: 8081
      targetPort: 8081
