# Default values for order-service Helm Chart

replicaCount: 2

image:
  repository: ghcr.io/parthdagia05/order-service
  pullPolicy: IfNotPresent
  tag: "31c7aa6dfdf24b7f0b1c523cb6870543d5f55db9"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 500m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 512Mi

probes:
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 10
    periodSeconds: 5
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 30
    periodSeconds: 10

postgres:
  enabled: true
  image: postgres:17
  database: orderdb
  username: orderuser
  password: orderpass
  storage: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  className: nginx
  host: orders.local
