apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
  order-service-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "title": "Order Service Pod Uptime / Status",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "up{job=~\"order-service|inventory-service\"}",
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "title": "JVM Memory Used (Bytes)",
          "type": "timeseries",
          "gridPos": { "h": 6, "w": 18, "x": 6, "y": 0 },
          "targets": [
            {
              "expr": "jvm_memory_used_bytes{area=\"heap\"}",
              "legendFormat": "Heap {{instance}}"
            }
          ]
        },
        {
          "title": "HTTP Request Rate (req/sec)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count[1m])) by (uri, status)",
              "legendFormat": "{{uri}} ({{status}})"
            }
          ]
        },
        {
          "title": "HTTP 5xx Server Errors",
          "type": "stat",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "targets": [
            {
              "expr": "sum(increase(http_server_requests_seconds_count{status=~\"5..\"}[5m])) or vector(0)",
              "legendFormat": "5xx Errors"
            }
          ]
        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["orders", "springboot", "devops"],
      "time": { "from": "now-15m", "to": "now" },
      "title": "Order Service Dashboard",
      "uid": "order-service-k8s"
    }
